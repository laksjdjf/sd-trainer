[project]
name = "sd-trainer"
version = "0.1.0"
description = "Stable Diffusion系モデルの学習フレームワーク"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.11,<2.12",
    "torchvision",
    "xformers>=0.0.35",
    # Qwen-Image-2.1 requires Diffusers git main; uv.lock pins the tested commit.
    "diffusers",
    "transformers>=5.17,<6",
    "accelerate",
    "safetensors",
    "omegaconf",
    "hydra-core>=1.3",
    "wandb",
    "rich",
    "tqdm",
    "pillow",
    "numpy",
    "opencv-python-headless",
    "pandas",
    "sentencepiece",
    "comfy-kitchen",
    "timm>=1.0.27",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = []

[tool.uv]
# アプリケーションとして使う(パッケージビルドしない)
package = false
# 実行環境はWSL2/Linuxのみ
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
xformers = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
